# unbinding
unbind = SUPER, TAB
unbind = SUPER, LEFT
unbind = SUPER, RIGHT
unbind = SUPER, UP
unbind = SUPER, DOWN
unbind = SUPER, H
unbind = SUPER, J
unbind = SUPER, K
unbind = SUPER, L
unbind = SUPER ALT, H
unbind = SUPER ALT, J
unbind = SUPER ALT, K
unbind = SUPER ALT, L

# menus
unbind = SUPER, SPACE
bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
bindd = SUPER, A, Launch apps, exec, omarchy-launch-walker

# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"H
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

bindd = SUPER SHIFT, K, Show key bindings, exec, omarchy-menu-keybindings
bindd = SUPER CTRL, Q, Lock system, exec, omarchy-lock-screen
bindd = SUPER, Z, Toggle Touchpad, exec, omarchy-toggle-touchpad toggle

# super Control panels
# bindd = SUPER CTRL, A, Audio controls, exec, omarchy-launch-audio
# bindd = SUPER CTRL, B, Bluetooth controls, exec, omarchy-launch-bluetooth
# bindd = SUPER CTRL, W, Wifi controls, exec, omarchy-launch-wifi
# bindd = SUPER CTRL, T, Activity, exec, omarchy-launch-tui btop

bindd = SUPER SHIFT, J, Toggle window split, layoutmsg, togglesplit

# fix?
# bindd = SUPER SHIFT, W, Close Tab, sendshortcut, CTRL, W, activewindow

# Navigation

bindd = SUPER, TAB, Former workspace, workspace, previous

bindd = SUPER, H, Scroll active workspace backward, workspace, e-1
bindd = SUPER, L, Scroll active workspace forward, workspace, e+1

bindd = SUPER, J, Focus on next window, cyclenext
bindd = SUPER, J, Reveal active window on top, bringactivetotop

bindd = SUPER, K, Focus on previous window, cyclenext, prev
bindd = SUPER, K, Reveal active window on top, bringactivetotop


# Move focus with SUPER + H,J,K,L
bindd = SUPER ALT, H, Focus on left window, movefocus, l
bindd = SUPER ALT, L, Focus on right window, movefocus, r

# Swap active window with the one next to it with SUPER + SHIFT + arrow keys
bindd = SUPER ALT, K, Swap window up, swapwindow, u
bindd = SUPER ALT, J, Swap window down, swapwindow, d








